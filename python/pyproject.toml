[project]
name = "lrb"
version = "0.1.0"
description = "Limited Recovery Basket AI - decision service, research backtester and reference strategy core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Windows-only: the official MetaTrader5 package publishes win_amd64 wheels only.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lrb-service = "lrb.service.main:run"
lrb-backtest = "lrb.research.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
